services:
  - type: web
    name: dripstore-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY_HOPS
        value: "1"
